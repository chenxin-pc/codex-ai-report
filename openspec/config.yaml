schema: spec-driven

context: |
  语言：中文（简体）
  所有产出物必须用简体中文撰写。

# 每产物规则 - 针对特定产物的额外指导
rules:
  proposal:
    - 思考过程遵循项目规则
    - 说明对现有功能的影响
    - 列出需要依赖外部功能
  specs:
    - 思考过程遵循项目规则
    - 使用 Given/When/Then 格式编写场景
    - 优先引用现有模式，避免重复发明
    - 包含边界条件和异常场景，注重代码健壮性
  design:
    - 思考过程遵循项目规则
    - 设计规范参考相关技能
    - 考虑性能和安全影响
  tasks:
    - 任务粒度适中
    - 按模块分组，使用层级编号
    - 包含必要的测试任务
    - 任务执行后需要确保代码可以编译通过
