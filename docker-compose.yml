services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: ai-report-etcd
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./volumes/etcd:/etcd
    networks:
      - ai-report-net

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: ai-report-minio
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./volumes/minio:/minio_data
    networks:
      - ai-report-net

  milvus:
    image: milvusdb/milvus:v2.4.8
    container_name: ai-report-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    networks:
      - ai-report-net

  mysql:
    image: mysql:8.4
    container_name: ai-report-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_report
      MYSQL_USER: ai_report
      MYSQL_PASSWORD: ai_report
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    networks:
      - ai-report-net

networks:
  ai-report-net:
    driver: bridge
