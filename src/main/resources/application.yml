spring:
  application:
    name: codex-ai-report
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_report_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      timeout: 5s
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${QWEN_CHAT_MODEL:qwen-plus-latest}
      embedding:
        options:
          model: ${QWEN_EMBEDDING_MODEL:text-embedding-v3}
    vectorstore:
      type: ${VECTOR_STORE_TYPE:milvus}
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
        database-name: ${MILVUS_DATABASE:default}
        collection-name: ${MILVUS_COLLECTION:report_chunks}
        embedding-dimension: ${MILVUS_DIMENSION:1024}
        index-type: ${MILVUS_INDEX_TYPE:IVF_FLAT}
        metric-type: ${MILVUS_METRIC_TYPE:COSINE}
        initialize-schema: ${MILVUS_INIT_SCHEMA:true}

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.example.aimilvusweb.entity
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: ${SERVER_PORT:8080}

app:
  ocr:
    endpoint: ${OCR_ENDPOINT:}
    api-key: ${OCR_API_KEY:}
    file-field: ${OCR_FILE_FIELD:file}
    model: ${OCR_MODEL:qwen-vl-ocr-latest}
    task: ${OCR_TASK:document_parsing}
    render-dpi: ${OCR_RENDER_DPI:160}
  report-quality:
    chunk:
      child-target-tokens: ${REPORT_CHUNK_CHILD_TARGET_TOKENS:700}
      child-max-tokens: ${REPORT_CHUNK_CHILD_MAX_TOKENS:1100}
      parent-target-tokens: ${REPORT_CHUNK_PARENT_TARGET_TOKENS:3000}
      parent-max-tokens: ${REPORT_CHUNK_PARENT_MAX_TOKENS:5200}
      overlap-tokens: ${REPORT_CHUNK_OVERLAP_TOKENS:120}
      min-slice-token-count: ${REPORT_CHUNK_MIN_SLICE_TOKEN_COUNT:30}
      llm-max-paragraphs-per-batch: ${REPORT_CHUNK_LLM_MAX_PARAGRAPHS_PER_BATCH:60}
      llm-max-tokens-per-batch: ${REPORT_CHUNK_LLM_MAX_TOKENS_PER_BATCH:8000}
      llm-overlap-paragraphs: ${REPORT_CHUNK_LLM_OVERLAP_PARAGRAPHS:10}
      llm-overlap-max-tokens: ${REPORT_CHUNK_LLM_OVERLAP_MAX_TOKENS:1200}
    retrieval:
      initial-top-k: ${REPORT_RETRIEVAL_INITIAL_TOP_K:20}
      final-top-k: ${REPORT_RETRIEVAL_FINAL_TOP_K:5}
      min-similarity-score: ${REPORT_RETRIEVAL_MIN_SIMILARITY_SCORE:0.0}
      rerank-enabled: ${REPORT_RETRIEVAL_RERANK_ENABLED:false}
      max-parent-context-tokens: ${REPORT_RETRIEVAL_MAX_PARENT_CONTEXT_TOKENS:4500}
      parent-aggregation-enabled: ${REPORT_RETRIEVAL_PARENT_AGGREGATION_ENABLED:true}
      max-parent-evidence-groups: ${REPORT_RETRIEVAL_MAX_PARENT_EVIDENCE_GROUPS:3}
      total-evidence-context-tokens: ${REPORT_RETRIEVAL_TOTAL_EVIDENCE_CONTEXT_TOKENS:12000}
      large-parent-context-tokens: ${REPORT_RETRIEVAL_LARGE_PARENT_CONTEXT_TOKENS:4500}
      child-window-neighbor-count: ${REPORT_RETRIEVAL_CHILD_WINDOW_NEIGHBOR_COUNT:1}
    query-guardrail:
      enabled: ${REPORT_QUERY_GUARDRAIL_ENABLED:true}
      dictionary-path: ${REPORT_QUERY_GUARDRAIL_DICTIONARY_PATH:query-guardrail/}
      rule-high-confidence-threshold: ${REPORT_QUERY_GUARDRAIL_RULE_HIGH_CONFIDENCE:0.8}
      rule-low-confidence-threshold: ${REPORT_QUERY_GUARDRAIL_RULE_LOW_CONFIDENCE:0.6}
      llm-fallback-enabled: ${REPORT_QUERY_GUARDRAIL_LLM_FALLBACK_ENABLED:true}
      llm-confidence-threshold: ${REPORT_QUERY_GUARDRAIL_LLM_CONFIDENCE:0.7}
      min-query-overlap-score: ${REPORT_QUERY_GUARDRAIL_MIN_QUERY_OVERLAP_SCORE:1}
  report-ingest-async:
    fixed-delay-ms: ${REPORT_INGEST_ASYNC_FIXED_DELAY_MS:3000}
    batch-size: ${REPORT_INGEST_ASYNC_BATCH_SIZE:5}
    max-attempts: ${REPORT_INGEST_ASYNC_MAX_ATTEMPTS:3}
    backoff-first-ms: ${REPORT_INGEST_ASYNC_BACKOFF_FIRST_MS:60000}
    backoff-second-ms: ${REPORT_INGEST_ASYNC_BACKOFF_SECOND_MS:300000}
    backoff-third-ms: ${REPORT_INGEST_ASYNC_BACKOFF_THIRD_MS:900000}
    spool-dir: ${REPORT_INGEST_ASYNC_SPOOL_DIR:reports/ingest-spool}
  milvus-hybrid:
    enabled: ${MILVUS_HYBRID_ENABLED:true}
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    database-name: ${MILVUS_DATABASE:default}
    collection-name: ${MILVUS_HYBRID_COLLECTION:report_chunks_hybrid}
    legacy-collection-names: ${MILVUS_LEGACY_COLLECTIONS:report_chunks}
    embedding-dimension: ${MILVUS_DIMENSION:1024}
    dense-vector-field: ${MILVUS_HYBRID_DENSE_FIELD:denseVector}
    sparse-vector-field: ${MILVUS_HYBRID_SPARSE_FIELD:sparseVector}
    text-field: ${MILVUS_HYBRID_TEXT_FIELD:chunkText}
    text-analyzer-type: ${MILVUS_HYBRID_TEXT_ANALYZER:standard}
    primary-key-field: ${MILVUS_HYBRID_PRIMARY_KEY:chunkUid}
    dense-index-type: ${MILVUS_HYBRID_DENSE_INDEX_TYPE:AUTOINDEX}
    sparse-index-type: ${MILVUS_HYBRID_SPARSE_INDEX_TYPE:SPARSE_INVERTED_INDEX}
    dense-metric-type: ${MILVUS_HYBRID_DENSE_METRIC:COSINE}
    sparse-metric-type: ${MILVUS_HYBRID_SPARSE_METRIC:BM25}
    ranker-type: ${MILVUS_HYBRID_RANKER_TYPE:RRF}
    rrf-k: ${MILVUS_HYBRID_RRF_K:60}
    dense-weight: ${MILVUS_HYBRID_DENSE_WEIGHT:0.6}
    bm25-weight: ${MILVUS_HYBRID_BM25_WEIGHT:0.4}
    auto-initialize: ${MILVUS_HYBRID_AUTO_INITIALIZE:true}
    route-score-diagnostics-enabled: ${MILVUS_HYBRID_ROUTE_SCORE_DIAGNOSTICS_ENABLED:true}
    metadata-filter-strategy: ${MILVUS_HYBRID_METADATA_FILTER_STRATEGY:BALANCED}
    author-filter-enabled: ${MILVUS_HYBRID_AUTHOR_FILTER_ENABLED:true}
    unique-ticker-hard-filter-enabled: ${MILVUS_HYBRID_UNIQUE_TICKER_HARD_FILTER_ENABLED:true}
    unique-company-hard-filter-enabled: ${MILVUS_HYBRID_UNIQUE_COMPANY_HARD_FILTER_ENABLED:true}
    theme-industry-hard-filter-enabled: ${MILVUS_HYBRID_THEME_INDUSTRY_HARD_FILTER_ENABLED:false}
